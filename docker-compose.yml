services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_PATH: /data/atlas.db
      PORT: "8000"
    volumes:
      - atlas-data:/data
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  atlas-data:
